    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ElaSegura</title>

    <!--
      O Expo só gera o favicon.ico, que não cobre notificação, "adicionar à
      tela de início" nem o ícone da PWA. Estes arquivos ficam em
      public/icons/ e são copiados para a raiz do site no build.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/manifest.webmanifest" />
    <meta name="theme-color" content="#F35F74" />
    <meta name="apple-mobile-web-app-title" content="ElaSegura" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
